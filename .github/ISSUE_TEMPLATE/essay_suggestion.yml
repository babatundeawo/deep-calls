name: Suggest a topic or correction
description: A question you would like explored, or a mistake in an essay.
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options: [A question or topic, A correction]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: If it is a correction, name the essay and the passage.
    validations:
      required: true
