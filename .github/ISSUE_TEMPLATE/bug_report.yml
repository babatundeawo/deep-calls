name: Report a problem
description: Something on the site is broken, wrong or hard to read.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: https://babatundeawo.github.io/deep-calls/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari
